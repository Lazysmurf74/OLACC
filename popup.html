<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="header">
    <div class="header-left">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="9" stroke="url(#g1)" stroke-width="1.5"/>
          <path d="M10 5v5l3 3" stroke="url(#g1)" stroke-width="1.5" stroke-linecap="round"/>
          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="20" y2="20" gradientUnits="userSpaceOnUse">
              <stop stop-color="#a78bfa"/>
              <stop offset="1" stop-color="#6366f1"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div>
        <h1>Site Cleaner</h1>
        <div id="currentSite">example.com</div>
      </div>
    </div>
    <a href="options.html" target="_blank" class="settings-btn" title="Impostazioni">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M8 10a2 2 0 100-4 2 2 0 000 4z" fill="currentColor"/>
        <path d="M13.3 8c0-.2 0-.4-.1-.6l1.3-1-.9-1.6-1.5.5c-.3-.3-.7-.5-1.1-.7L10.7 3H9.3l-.3 1.6c-.4.2-.8.4-1.1.7L6.4 4.8l-.9 1.6 1.3 1c0 .2-.1.4-.1.6s0 .4.1.6l-1.3 1 .9 1.6 1.5-.5c.3.3.7.5 1.1.7l.3 1.6h1.4l.3-1.6c.4-.2.8-.4 1.1-.7l1.5.5.9-1.6-1.3-1c.1-.2.1-.4.1-.6z" fill="currentColor"/>
      </svg>
    </a>
  </div>

  <div class="auto-clean-card">
    <div class="auto-clean-left">
      <span class="auto-clean-label">Auto clean</span>
      <span class="auto-clean-status" id="autoCleanStatus">ACTIVE</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="autoClean">
      <span class="slider"></span>
    </label>
  </div>

  <button id="cleanBtn" class="clean-btn">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M2 13l2.5-7h7L14 13H2z" stroke="white" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M5.5 6L6 3h4l.5 3" stroke="white" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M1 6h14" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
    <span id="cleanBtnText">Clean now</span>
  </button>

  <button id="addSiteBtn" class="protect-btn">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M8 2L3 4.5V8c0 2.8 2 5.2 5 6 3-0.8 5-3.2 5-6V4.5L8 2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
    </svg>
    Protect site
  </button>

  <div class="data-row">
    <button class="data-btn" id="cookieBtn">
      <span class="data-icon">🍪</span>
      <span>Cookies</span>
    </button>
    <button class="data-btn" id="storageBtn">
      <span class="data-icon">💾</span>
      <span>Storage</span>
    </button>
    <button class="data-btn" id="cacheBtn">
      <span class="data-icon">⚡</span>
      <span>Cache</span>
    </button>
  </div>

  <!-- STATISTICHE -->
  <div class="stats-card">
    <div class="stats-header">
      <span class="stats-title">Statistiche</span>
      <button class="reset-stats-btn" id="resetStatsBtn" title="Azzera statistiche">↺</button>
    </div>
    <div class="stats-grid">
      <div class="stat-item">
        <span class="stat-value" id="statCleans">—</span>
        <span class="stat-label">Pulizie</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="statCookies">—</span>
        <span class="stat-label">Cookie rimossi</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="statSites">—</span>
        <span class="stat-label">Siti unici</span>
      </div>
    </div>
    <div class="stat-last" id="statLast">Nessuna pulizia ancora</div>
  </div>

</div>

<script src="popup.js"></script>
</body>
</html>
