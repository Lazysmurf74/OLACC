<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="header-icon">🛡️</div>
    <div class="header-text">
      <div class="app-name">Site Cleaner Pro</div>
      <div id="currentSite" class="current-site">—</div>
    </div>
    <div class="header-badge" id="statusBadge">ON</div>
  </div>

  <!-- Auto clean -->
  <div class="toggle-card">
    <div>
      <div class="toggle-label">Auto clean</div>
      <div class="toggle-sub" id="autoSub">INATTIVO</div>
    </div>
    <label class="switch"><input type="checkbox" id="autoClean"><span class="slider"></span></label>
  </div>

  <!-- Clean now -->
  <button id="cleanBtn" class="btn-primary">🗑️ Pulisci sito adesso</button>

  <!-- Protect -->
  <button id="addSiteBtn" class="btn-ghost">🔒 Proteggi sito corrente</button>

  <!-- Chips -->
  <div class="chips">
    <button class="chip" data-key="clearCookies">🍪<span class="lbl">Cookie</span></button>
    <button class="chip" data-key="clearLocalStorage">💾<span class="lbl">Storage</span></button>
    <button class="chip" data-key="clearCache">⚡<span class="lbl">Cache</span></button>
    <button class="chip" data-key="clearHistory">📋<span class="lbl">History</span></button>
  </div>

  <!-- Banner cookie -->
  <div class="sec">BANNER COOKIE</div>

  <div class="toggle-card">
    <div>
      <div class="toggle-label">Blocca avvisi cookie</div>
      <div class="toggle-sub" id="bannerSub">INATTIVO</div>
    </div>
    <label class="switch"><input type="checkbox" id="blockBanners"><span class="slider"></span></label>
  </div>

  <button id="addExcBtn" class="btn-ghost btn-sm">➕ Eccezione per questo sito</button>
  <div id="excMsg" class="msg" style="display:none"></div>

  <!-- Statistiche -->
  <div class="sec">STATISTICHE <span class="sec-refresh" id="refreshStats">↺</span></div>

  <div class="stats">
    <div class="stat"><div class="stat-n" id="sCleans">0</div><div class="stat-l">Pulizie</div></div>
    <div class="stat"><div class="stat-n" id="sCookies">0</div><div class="stat-l">Cookie</div></div>
    <div class="stat"><div class="stat-n" id="sSites">0</div><div class="stat-l">Siti</div></div>
  </div>

  <div class="last-clean" id="lastClean"></div>

  <a href="options.html" target="_blank" class="foot-link">⚙️ Impostazioni avanzate</a>

</div>
<script src="popup.js"></script>
</body>
</html>
