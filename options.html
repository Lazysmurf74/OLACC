
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>Impostazioni avanzate</h1>

<label>
Modalità:
<select id="mode">
<option value="whitelist">Whitelist</option>
<option value="blacklist">Blacklist</option>
</select>
</label>

<label>
<input type="checkbox" id="clearCookies">
Elimina cookie
</label>

<label>
<input type="checkbox" id="clearCache">
Elimina cache
</label>

<label>
<input type="checkbox" id="clearLocalStorage">
Elimina LocalStorage + IndexedDB
</label>

<label>
<input type="checkbox" id="clearHistory">
Elimina cronologia
</label>

<h2>Whitelist / Blacklist</h2>

<p>
Un dominio per riga.
Supporta *.dominio.com
</p>

<textarea id="siteList"></textarea>

<h2>Login protetti</h2>

<textarea id="protectedLogins"></textarea>

<button id="saveBtn">
Salva impostazioni
</button>

</div>

<script src="options.js"></script>

</body>
</html>
